name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { php: "8.2", laravel: "11.*" }
          - { php: "8.3", laravel: "12.*" }
          - { php: "8.4", laravel: "13.*" }
          - { php: "8.5", laravel: "13.*" }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --no-interaction --no-progress --with-all-dependencies
      - run: vendor/bin/phpunit
