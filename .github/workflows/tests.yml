name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.2", laravel: "12.*", testbench: "10.*" }
          - { php: "8.3", laravel: "12.*", testbench: "10.*" }
          - { php: "8.4", laravel: "13.*", testbench: "11.*" }
          - { php: "8.5", laravel: "13.*", testbench: "11.*" }
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
      - run: composer update --no-interaction --no-progress --with-all-dependencies
      - run: vendor/bin/phpunit
